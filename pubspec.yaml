name: dramus
description: "A new Flutter project."
publish_to: "none"

version: 1.1.1+7
environment:
  sdk: ^3.6.0
dependencies:
  dio: ^5.0.3
  shared_preferences: ^2.0.15
  flutter_secure_storage: ^9.2.2
  image_picker: ^1.1.1
  intl: 0.20.2
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  provider: ^6.1.2
  path: ^1.8.2
  flutter_map: ^5.0.0
  latlong2: ^0.9.0
  geolocator: ^11.0.0
  connectivity_plus: ^7.0.0
  cached_network_image: ^3.3.1
  url_launcher: ^6.3.0
  flutter_svg: ^2.0.10
  shimmer: ^3.0.0
  socket_io_client: ^3.0.0
  # Déjà installées
  
  # Nouvelles dépendances
  http: ^1.1.0 
  package_info_plus: ^9.0.0
  firebase_core: ^4.4.0
  firebase_messaging: ^16.1.1
  flutter_local_notifications: ^20.1.0
  change_app_package_name: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/dramus_logo.png"
  adaptive_icon_background: "#1E2330"
  adaptive_icon_foreground: "assets/icons/dramus_logo.png"
  remove_alpha_ios: true
